[package]
name = "nostyra-launcher"
description = "Nostyra desktop launcher: library UI that starts nostyra-runner per game."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Distinct lib name: a bin and lib sharing a name collide on Windows (PDB files).
[lib]
name = "nostyra_launcher_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# RetroAchievements: hardcore flag + login file (resume / slot gating), phase 06 UI.
achievements.workspace = true
anyhow.workspace = true
artwork-cache.workspace = true
# M19 cloud saves: sync units, executor, Local folder provider (HTTP providers later).
cloud-sync.workspace = true
config-layers = { workspace = true, features = ["fs"] }
core-manager.workspace = true
# Resume-point warnings: CRC of save.srm / the soft-patch file vs the sidecar.
crc32fast.workspace = true
game-library.workspace = true
http-download-util.workspace = true
ipc-protocol = { workspace = true, features = ["native"] }
rayon.workspace = true
rom-patch.workspace = true
runner-session.workspace = true
# Gamepad capture for the Controls editor only (SDL lives for one capture).
sdl3.workspace = true
# Update checker: GitHub release tag vs CARGO_PKG_VERSION.
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
storage-db.workspace = true
system-catalog.workspace = true
md-5.workspace = true
chrono.workspace = true
# protocol-asset: cached artwork is served from <data>/artwork via asset://.
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tracing.workspace = true
# Bug-report zip (Settings → About → Create bug report).
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# In-memory cloud provider with fault / delay hooks (cloud command tests).
cloud-sync = { workspace = true, features = ["test-support"] }
disc-image = { workspace = true, features = ["test-images"] }
# Synthetic PS2 BIOS images for the import / Settings view tests.
system-catalog = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
