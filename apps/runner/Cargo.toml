[package]
name = "nostyra-runner"
description = "Standalone runner: plays one game with one libretro core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# RetroAchievements session (rc_client, memory regions, journal, snapshot).
achievements.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# Sidecar CRCs of SRAM and the soft-patch file (resume-point warnings).
crc32fast.workspace = true
config-layers = { workspace = true, features = ["fs"] }
ipc-protocol = { workspace = true, features = ["native"] }
audio-output.workspace = true
image.workspace = true
input-mapping.workspace = true
rom-patch.workspace = true
libretro-host.workspace = true
# OpenGL contexts for cores that render on the GPU (N64).
hw-render-gl.workspace = true
lz4_flex.workspace = true
# Dreamcast BIOS check before Flycast boots it (CoreSpec.bios_switch).
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sdl3.workspace = true
tracing.workspace = true
video-renderer.workspace = true
winit.workspace = true
# Systems: size limits, saves folder and classification (same registry as the scanner).
system-catalog.workspace = true
disc-image.workspace = true
# Content sha1 of the game (save-folder id) when the launcher did not pass it.
game-library.workspace = true
tempfile.workspace = true
# M20 netplay: room socket, lobby, sync and the ggrs rollback driver (native).
netplay-session = { workspace = true, features = ["native"] }
# ggrs types in the rollback host (`Frame`, `InputStatus`) and the synctest suite.
ggrs = "0.13"
# Netplay fingerprint: sha256 of the core DLL and of the core options.
sha2.workspace = true
# M20 phase-00 spike only (feature `netplay-spike`, default off): WebRTC loopback probes.
matchbox_socket = { version = "0.15", features = ["ggrs"], optional = true }
futures = { version = "0.3", optional = true }
# Own ggrs packet framing (session epoch byte) on the shared channel; same bincode as matchbox.
bincode = { version = "2", default-features = false, features = ["serde", "alloc"], optional = true }

[features]
netplay-spike = ["dep:matchbox_socket", "dep:futures", "dep:bincode"]

[dev-dependencies]
zip.workspace = true
# Per-thread allocation counter (replaces the test binary's global allocator): M20
# netplay hot-path test (lobby poll + HUD redraw allocation-free after warm-up).
allocation-counter = "0.8"
# Synthetic PS2 BIOS images for the BIOS option / refusal tests.
system-catalog = { workspace = true, features = ["test-fixtures"] }
# Synthetic Dreamcast images (GDI fixtures) for the runner's process tests.
disc-image = { workspace = true, features = ["test-images"] }
# sdl3 0.20 refuses `Sdl::new` off the first thread unless its `test-mode` is on (GL
# tests init SDL on test threads). Dev only: release builds keep the main-thread rule.
sdl3 = { workspace = true, features = ["test-mode"] }

[lints]
workspace = true
