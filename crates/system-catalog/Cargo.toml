[package]
name = "system-catalog"
description = "Registry of supported systems and libretro cores, and content-based ROM classification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# std only: the runner, launcher and library crates all read this registry.
[dependencies]
# Content reads (OS files, or the web edition's virtual source).
content-file-source.workspace = true

[features]
# Synthetic BIOS fixtures for dependent crates' tests (dev-dependencies only).
test-fixtures = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
