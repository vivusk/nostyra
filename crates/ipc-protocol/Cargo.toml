[package]
name = "ipc-protocol"
description = "Launcher <-> runner contract: JSON-line events, exit codes, shared data paths, log files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native"]
# Desktop only: OS data roots (`directories`), log files (chrono, tracing) and the
# on-disk game entry lookup. Off for the web edition (wasm32).
native = ["dep:chrono", "dep:directories", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Log file names and timestamps in local time (log_files).
chrono = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# Shared log setup (stderr + size-capped file) for launcher and runner.
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
